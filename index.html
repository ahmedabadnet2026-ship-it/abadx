<style>
@font-face{font-family:"CairoLocal";src:url("assets/Cairo.ttf") format("truetype");font-weight:200 1000;font-display:swap}
:root{
  --bg:#F5F5F2; --paper:#FBFBF9; --ink:#0A0A0A; --ink-2:#3A3A38; --muted:#6E6E6A;
  --line:#DCDCD7; --line-2:#C9C9C3; --gold:#F5BD2D;
  --term:#0B0B0C; --term-line:#232326;
  --ar:"Cairo","CairoLocal",system-ui,sans-serif;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --max:1240px;
}
#axHero .mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:11px;line-height:1.4}


#axHero .wrap{max-width:var(--max);margin:0 auto;width:100%}

#axHero{position:relative;flex:1;overflow:hidden;border-bottom:1px solid var(--line)}
#axHero #net{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#axHero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.3fr .9fr;gap:48px;align-items:center;padding:72px 24px 80px;min-height:calc(100vh - 73px)}
#axHero .copy{max-width:700px}
#axHero .logo{position:relative;width:86px;height:99px;margin-bottom:30px;opacity:0}
#axHero .logo img{width:100%;height:100%;object-fit:contain;display:block}
#axHero .logo svg{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);overflow:visible}
#axHero .logo svg path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:square;stroke-dasharray:44;stroke-dashoffset:44}
#axHero .logo svg path.g{stroke:var(--gold);stroke-width:2}
#axHero .eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:14px;opacity:0}
#axHero .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
#axHero h1{font-family:var(--ar);font-weight:800;font-size:clamp(32px,4.1vw,56px);line-height:1.28;margin:0 0 14px;letter-spacing:0;min-height:1.25em}
#axHero .sub{font-family:var(--ar);font-weight:600;font-size:clamp(18px,1.9vw,25px);line-height:1.5;color:var(--ink-2);margin:0 0 10px;min-height:1.5em}
#axHero .en{font-family:var(--mono);font-size:clamp(13px,1.25vw,16px);color:var(--muted);direction:ltr;text-align:right;margin:0 0 34px;font-weight:500;min-height:1.6em}
#axHero .ghost{color:transparent;user-select:none}
#axHero .caret{display:inline-block;width:.09em;min-width:3px;height:1em;background:var(--ink);vertical-align:-.12em;margin-inline:2px;visibility:hidden}
#axHero .caret.on{visibility:visible;animation:blink 1s steps(1) infinite}
#axHero .en .caret{background:var(--gold);width:.55em;height:1.1em;vertical-align:-.2em}
@keyframes blink{50%{opacity:0}}
#axHero .ctas{display:flex;gap:12px;flex-wrap:wrap;align-items:center;opacity:0}
#axHero .btn{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 26px;border-radius:999px;font-weight:700;font-size:16px;border:1.5px solid var(--ink);transition:transform .15s,background .15s}
#axHero .btn.primary{background:var(--ink);color:#fff}
#axHero .btn.primary:hover{transform:translateY(-1px)}
#axHero .btn.primary .arr{display:inline-block;transition:transform .2s;color:var(--gold)}
#axHero .btn.primary:hover .arr{transform:translateX(-4px)}
#axHero .btn.ghostbtn{background:transparent;color:var(--ink)}
#axHero .btn.ghostbtn:hover{background:#fff}
#axHero .path{margin-top:30px;display:flex;flex-wrap:wrap;row-gap:8px;align-items:center;gap:10px;color:var(--muted);direction:ltr;justify-content:flex-end;opacity:0}
#axHero .path .n{display:inline-flex;align-items:center;gap:6px}
#axHero .path .n::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink)}
#axHero .path .n.g::before{background:var(--gold);border-color:var(--gold)}
#axHero .path .sep{width:28px;height:1px;background:var(--line-2)}

#axHero .term{background:var(--term);color:#D9D9D4;border-radius:14px;border:1px solid var(--term-line);box-shadow:0 30px 60px -30px rgba(0,0,0,.45),0 0 0 6px rgba(10,10,10,.04);overflow:hidden;direction:ltr;text-align:left;font-family:var(--mono);font-size:12px;line-height:1.62;opacity:0}
#axHero .term .bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--term-line);color:#77776f;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
#axHero .term .bar i{width:9px;height:9px;border-radius:50%;background:#2c2c30;display:inline-block}
#axHero .term .bar i:first-child{background:var(--gold)}
#axHero .term .bar span{margin-left:8px}
#axHero .term .bar em{margin-left:auto;font-style:normal;color:#55554f}
#axHero .term .tabs{display:flex;gap:0;border-bottom:1px solid var(--term-line);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
#axHero .term .tabs span{flex:1;text-align:center;padding:7px 4px;color:#5f5f59;border-right:1px solid var(--term-line);transition:color .25s,background .25s}
#axHero .term .tabs span:last-child{border-right:0}
#axHero .term .tabs span.on{color:#fff;background:#141416;box-shadow:inset 0 -2px 0 var(--gold)}
#axHero .term .h{color:#c9c9c2}
#axHero .term pre{margin:0;padding:16px 18px 20px;min-height:384px;white-space:pre-wrap;word-break:break-all;font-family:inherit}
#axHero .term .p{color:#8a8a82}
#axHero .term .u{color:#fff}
#axHero .term .o{color:#9d9d95}
#axHero .term .ok{color:#cfe8c4}
#axHero .term .tc{display:inline-block;width:.6em;height:1.15em;background:#D9D9D4;vertical-align:-.25em;animation:blink 1s steps(1) infinite}

@media (max-width:900px){
  #axHero .wrap{grid-template-columns:1fr;gap:34px;padding:40px 20px 48px;min-height:0}
  #axHero .logo{width:62px;height:71px;margin-bottom:22px}
  #axHero h1{font-size:clamp(30px,8.6vw,40px)}
  #axHero .sub{font-size:17px}
  #axHero .en{font-size:12.5px;margin-bottom:24px}
  #axHero .btn{height:48px;padding:0 14px;font-size:14.5px;white-space:nowrap}
  #axHero .ctas .btn{flex:1;justify-content:center}
  #axHero .path{justify-content:flex-start;font-size:9.5px;gap:7px;letter-spacing:.1em}
  #axHero .path .sep{width:16px}
  #axHero .term{font-size:11px}
  #axHero .term .bar em{font-size:9.5px}
  #axHero .term pre{min-height:360px;padding:14px}
  #axHero .term .tabs{font-size:9px}
}
@media (prefers-reduced-motion:reduce){.caret.on,.term .tc{animation:none}}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
#axHero a{color:inherit;text-decoration:none}
#axHero .btn.primary{color:#fff}
#axHero .copy{text-align:right}
#axHero,#axHero *,#axHero *::before,#axHero *::after{box-sizing:border-box}
#axHero .wrap>*{min-width:0}
#axHero .term .bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#axHero .term .bar em{white-space:nowrap;flex:none}
@media (max-width:900px){#axHero .term .bar{letter-spacing:.06em}}
@media (max-width:900px){#axHero .wrap{grid-template-columns:minmax(0,1fr)}#axHero .ctas .btn{min-width:0}}
</style>

  <div class="wrap">
    <div class="copy">
      <div class="logo" id="logo">
        <svg viewBox="0 0 106 119" aria-hidden="true">
          <path id="br1" d="M0 22 V0 H22"/>
          <path id="br2" class="g" d="M84 0 H106 V22"/>
          <path id="br3" d="M106 97 V119 H84"/>
          <path id="br4" d="M22 119 H0 V97"/>
        </svg>
        <img id="logoImg" src="assets/brand/abadx-mark-black-tight.png" alt="Abad X">
      </div>
      <div class="eyebrow mono i18n-skip" id="eyebrow"><i></i><span>ABAD X · IT ACADEMY · HANDS-ON</span></div>

      <p class="sub i18n-skip" id="sub" aria-label="تخصصات، شهادات، وغرف تدريب — بسرعتك"><span id="subTyped" aria-hidden="true"></span><span class="caret" id="subCaret" aria-hidden="true"></span><span class="ghost" id="subGhost" aria-hidden="true"></span></p>
      <p class="en i18n-skip" id="en" lang="en" aria-label="Hands-on IT training on real labs."><span id="enTyped" aria-hidden="true"></span><span class="caret" id="enCaret" aria-hidden="true"></span><span class="ghost" id="enGhost" aria-hidden="true"></span></p>

        <a class="n" href="academy.html">ACADEMY</a><span class="sep"></span><a class="n" href="self-learning.html">ROOMS</a><span class="sep"></span><a class="n g" href="labs.html">LABS</a><span class="sep"></span><a class="n" href="ctf.html">CTF</a><span class="sep"></span><a class="n" href="library.html">LIBRARY</a>

      <div class="tabs" id="tabs"><span data-k="net">NET</span><span data-k="linux">LINUX</span><span data-k="cloud">CLOUD</span><span data-k="kali">KALI</span></div>
      <pre id="termOut" aria-hidden="true"></pre>
    </div>

</section>
<script>
(() => {
  const AR  = 'اتعلّم تقنية المعلومات عملياً على مختبرات حقيقية';
  const SUB = 'تخصصات، شهادات، وغرف تدريب — بسرعتك';
  const EN  = 'Hands-on IT training on real labs.';
  const arChars = Array.from(AR);
  const subChars = Array.from(SUB);
  const enChars = Array.from(EN);

  // Rough timeline (~3s to headline settle, then CTAs + terminal)
  // logo 0–700, AR type ~620–1700, EN ~1820–2550, CTAs ~2700, term fade+type ~2800+
  const T = {
    logoIn: 0, logoDur: 700,
    brackets: 80, bracketsDur: 560,
    arStart: 620, arStep: 28,
    subGap: 140, subStep: 20,
    enGap: 120, enStep: 20,
    btnGap: 160, btnDur: 420,
    termFadeDur: 500
  };
  T.arEnd = T.arStart + arChars.length * T.arStep;
  T.subStart = T.arEnd + T.subGap;
  T.subEnd = T.subStart + subChars.length * T.subStep;
  T.enStart = T.subEnd + T.enGap;
  T.enEnd = T.enStart + enChars.length * T.enStep;
  T.btnAt = T.enEnd + T.btnGap;
  T.termFadeAt = T.btnAt + 80;
  T.termStart = T.termFadeAt + 400;

  const $ = (id) => document.getElementById(id);
  const logo = $('logo');
  const eyebrow = $('eyebrow');
  const arTyped = $('arTyped');
  const arCaret = $('arCaret');
  const arGhost = $('arGhost');
  const subTyped = $('subTyped');
  const subCaret = $('subCaret');
  const subGhost = $('subGhost');
  const enTyped = $('enTyped');
  const enCaret = $('enCaret');
  const enGhost = $('enGhost');
  const ctas = $('ctas');
  const path = $('path');
  const term = $('term');
  const termOut = $('termOut');
  const brPaths = [1,2,3,4].map(i => document.getElementById('br'+i));

  arGhost.textContent = AR;
  subGhost.textContent = SUB;
  enGhost.textContent = EN;
  const termHost = $('termHost');
  const tabs = Array.from(document.querySelectorAll('#tabs span'));
  function setTab(k, host) {
    tabs.forEach(t => t.classList.toggle('on', t.dataset.k === k));
    if (host) termHost.textContent = host;
  }

  // Broad-IT demo session: networking → linux → cloud → Kali lab (all fictional output)
  const P = (u, h) => '<span class="p">' + u + '@' + h + '</span>:<span class="u">~</span>$ ';
  const TERM_LINES = [
    {tab: 'net', host: 'lab@abadx — net-01'},
    {html: P('lab','net-01'), type: 'ping -c 2 10.10.10.1'},
    {html: '<span class="o">64 bytes from 10.10.10.1: icmp_seq=1 time=0.8 ms\n2 packets transmitted, 2 received, 0% loss</span>', delay: 300},
    {html: '\n' + P('lab','net-01'), type: 'show vlan brief'},
    {html: '<span class="o">10  USERS    active   Gi0/1-12\n20  SERVERS  active   Gi0/13-24</span>', delay: 380},
    {tab: 'linux', host: 'lab@abadx — linux-01'},
    {html: '\n' + P('lab','linux-01'), type: 'systemctl is-active nginx'},
    {html: '<span class="ok">active</span>', delay: 380},
    {tab: 'cloud', host: 'lab@abadx — cloud-01'},
    {html: '\n' + P('lab','cloud-01'), type: 'kubectl get nodes'},
    {html: '<span class="o">NAME      STATUS   ROLES           AGE\nnode-1    Ready    control-plane   2d\nnode-2    Ready    worker          2d</span>', delay: 380},
    {tab: 'kali', host: 'kali@abadx — kali-lab'},
    {html: '\n' + P('kali','lab'), type: 'nmap -F 10.10.20.5'},
    {html: '<span class="o">22/tcp open ssh · 80/tcp open http</span>', delay: 280},
    {html: '\n<span class="ok">[✓] room complete · next: academy track</span>\n' + P('lab','abadx') + '<span class="tc"></span>', delay: 180}
  ];

  let timers = [];
  let rafId = 0;
  let running = false;

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }
  function later(ms, fn) {
    const id = setTimeout(fn, ms);
    timers.push(id);
    return id;
  }

  function fade(el, from, to, dur, delay) {
    later(delay, () => {
      el.style.transition = `opacity ${dur}ms ease`;
      el.style.opacity = String(from);
      // force reflow
      void el.offsetWidth;
      el.style.opacity = String(to);
    });
  }

  function typeChars(chars, target, caret, start, step) {
    const ghost = document.getElementById(target.id.replace('Typed', 'Ghost'));
    later(start, () => caret.classList.add('on'));
    chars.forEach((ch, i) => {
      later(start + (i + 1) * step, () => {
        target.textContent += ch;
        if (ghost) ghost.textContent = chars.slice(i + 1).join('');
        if (i === chars.length - 1) {
          later(180, () => caret.classList.remove('on'));
        }
      });
    });
  }

  function typeTermLine(text, baseHtml, start, cps) {
    // type character by character into terminal after baseHtml prompt
    const step = Math.max(12, Math.floor(1000 / (cps || 42)));
    const chars = Array.from(text);
    chars.forEach((ch, i) => {
      later(start + (i + 1) * step, () => {
        // rebuild: keep previous committed + current typed
        const committed = termOut.dataset.committed || '';
        termOut.innerHTML = committed + baseHtml + '<span class="u">' + text.slice(0, i + 1) + '</span><span class="tc"></span>';
      });
    });
    const doneAt = start + chars.length * step + 40;
    later(doneAt, () => {
      const committed = (termOut.dataset.committed || '') + baseHtml + '<span class="u">' + text + '</span>\n';
      termOut.dataset.committed = committed;
      termOut.innerHTML = committed + '<span class="tc"></span>';
    });
    return doneAt;
  }

  function runTerminal(startAt) {
    termOut.dataset.committed = '';
    termOut.innerHTML = '<span class="tc"></span>';
    let t = startAt;
    TERM_LINES.forEach((line) => {
      if (line.tab) {
        later(t, () => setTab(line.tab, line.host));
      } else if (line.type) {
        const done = typeTermLine(line.type, line.html, t, 46);
        t = done + 180;
      } else {
        later(t, () => {
          const committed = (termOut.dataset.committed || '') + line.html + '\n';
          termOut.dataset.committed = committed;
          termOut.innerHTML = committed + '<span class="tc"></span>';
        });
        t += (line.delay || 300);
      }
    });
  }

  function resetUI() {
    clearTimers();
    logo.style.transition = 'none';
    logo.style.opacity = '0';
    eyebrow.style.transition = 'none';
    eyebrow.style.opacity = '0';
    ctas.style.transition = 'none';
    ctas.style.opacity = '0';
    path.style.transition = 'none';
    path.style.opacity = '0';
    term.style.transition = 'none';
    term.style.opacity = '0';
    arTyped.textContent = '';
    subTyped.textContent = '';
    arGhost.textContent = AR; subGhost.textContent = SUB; enGhost.textContent = EN;
    enTyped.textContent = '';
    subCaret.classList.remove('on');
    setTab('net', 'lab@abadx — net-01');
    arCaret.classList.remove('on');
    enCaret.classList.remove('on');
    termOut.innerHTML = '';
    termOut.dataset.committed = '';
    brPaths.forEach(p => {
      p.style.transition = 'none';
      p.style.strokeDashoffset = '44';
    });
  }

  function play() {
    resetUI();
    running = true;
    fade(logo, 0, 1, T.logoDur, T.logoIn);
    later(T.brackets, () => {
      brPaths.forEach((p, i) => {
        later(i * 70, () => {
          p.style.transition = `stroke-dashoffset ${T.bracketsDur}ms cubic-bezier(.4,0,.2,1)`;
          p.style.strokeDashoffset = '0';
        });
      });
    });
    fade(eyebrow, 0, 1, 400, Math.max(0, T.arStart - 80));
    typeChars(arChars, arTyped, arCaret, T.arStart, T.arStep);
    typeChars(subChars, subTyped, subCaret, T.subStart, T.subStep);
    typeChars(enChars, enTyped, enCaret, T.enStart, T.enStep);
    fade(ctas, 0, 1, T.btnDur, T.btnAt);
    fade(path, 0, 1, T.btnDur, T.btnAt + 80);
    fade(term, 0, 1, T.termFadeDur, T.termFadeAt);
    runTerminal(T.termStart);
  }

  // ---- network canvas ----
  const canvas = $('net');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  // Nodes: broad IT map (network · linux · cloud · db · lab) + extras
  const nodesRel = [
    {x:0.12,y:0.55,label:'NET',gold:true},
    {x:0.28,y:0.32,label:'LINUX',gold:false},
    {x:0.38,y:0.62,label:'CLOUD',gold:true},
    {x:0.52,y:0.28,label:'',gold:false},
    {x:0.62,y:0.58,label:'DB',gold:false},
    {x:0.78,y:0.40,label:'LAB',gold:true},
    {x:0.86,y:0.68,label:'',gold:false},
    {x:0.20,y:0.78,label:'',gold:false},
    {x:0.48,y:0.78,label:'',gold:false},
    {x:0.70,y:0.22,label:'',gold:false}
  ];
  const edges = [
    [0,1],[0,2],[0,7],[1,2],[1,3],[2,4],[2,8],[3,5],[3,4],[4,5],[4,6],[5,6],[5,9],[3,9],[7,8],[8,4]
  ];
  let packets = [];
  let t0 = performance.now();

  function resize() {
    const r = canvas.parentElement.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function nodePos(n) { return {x: n.x * W, y: n.y * H}; }

  function draw(now) {
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    // edges
    ctx.lineWidth = 1.15;
    edges.forEach(([a,b], ei) => {
      const A = nodePos(nodesRel[a]), B = nodePos(nodesRel[b]);
      ctx.strokeStyle = 'rgba(10,10,10,0.16)';
      ctx.beginPath();
      ctx.moveTo(A.x, A.y);
      ctx.lineTo(B.x, B.y);
      ctx.stroke();
      // traveling dash packet
      const phase = (t * 0.22 + ei * 0.17) % 1;
      const px = A.x + (B.x - A.x) * phase;
      const py = A.y + (B.y - A.y) * phase;
      ctx.fillStyle = 'rgba(245,189,45,0.75)';
      ctx.beginPath();
      ctx.arc(px, py, 2.0, 0, Math.PI * 2);
      ctx.fill();
    });
    // nodes
    nodesRel.forEach((n, i) => {
      const p = nodePos(n);
      const pulse = 0.5 + 0.5 * Math.sin(t * 2.4 + i * 0.7);
      if (n.gold) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 12 + pulse * 5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245,189,45,${0.14 + pulse * 0.16})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = '#F5BD2D';
        ctx.fill();
        if (n.label) {
          ctx.font = '600 10px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(10,10,10,0.45)';
          ctx.textAlign = 'center';
          ctx.fillText(n.label, p.x, p.y - 16);
        }
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(10,10,10,0.38)';
        ctx.fill();
        if (n.label) {
          ctx.font = '500 9.5px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(10,10,10,0.32)';
          ctx.textAlign = 'center';
          ctx.fillText(n.label, p.x, p.y - 12);
        }
      }
    });
    rafId = requestAnimationFrame(draw);
  }

  function startNet() {
    resize();
    t0 = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);

  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function settle() {
    resetUI();
    [logo, eyebrow, ctas, path, term].forEach(el => { el.style.opacity = '1'; });
    brPaths.forEach(p => { p.style.strokeDashoffset = '0'; });
    arTyped.textContent = AR; subTyped.textContent = SUB; enTyped.textContent = EN;
    arGhost.textContent = subGhost.textContent = enGhost.textContent = '';
    let html = '';
    TERM_LINES.forEach(l => { if (l.tab) setTab(l.tab, l.host); else if (l.type) html += l.html + '<span class="u">' + l.type + '</span>\n'; else html += l.html + '\n'; });
    termOut.innerHTML = html;
  }
  if (RM) { resize(); settle(); return; }
  // wait for fonts then play
  document.fonts.ready.then(() => {
    startNet();
    play();
  }).catch(() => {
    startNet();
    play();
  });
})();
</script>
